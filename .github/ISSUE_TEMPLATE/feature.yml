name: Предложить возможность
description: Опишите задачу пользователя и проверяемый результат.
title: "[Предложение] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача пользователя
      description: Кому нужна возможность и какую задачу она решает?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Ожидаемый результат
      description: Опишите поведение и условия приёмки.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Для кого
      options:
        - Клиент
        - Разработчик
        - Оператор платформы
        - Владелец сайта или магазина
        - Внутренняя команда
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Ограничения и связанные контракты
      description: Добавьте ссылки на известные задачи, решения или контракты AACSearch.
