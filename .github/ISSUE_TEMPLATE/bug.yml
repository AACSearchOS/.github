name: Сообщить об ошибке
description: Опишите воспроизводимую ошибку AACSearch без ключей и данных клиентов.
title: "[Ошибка] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - API платформы
        - Поисковый движок
        - Внутренний шлюз
        - 1C-Bitrix
        - PrestaShop
        - Diafan CMS
        - Документация или SDK
        - Другое
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Что произошло?
      description: Укажите фактический и ожидаемый результат.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести?
      description: Приведите короткий пример без конфиденциальных данных.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или коммит
      description: Для модуля укажите также версию CMS или платформы магазина.
  - type: textarea
    id: evidence
    attributes:
      label: Логи или снимки экрана
      description: Удалите ключи API, персональные данные, документы клиентов и внутренние адреса.
